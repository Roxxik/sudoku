name = "backend"
main = "src/index.js"
compatibility_date = "2026-06-23"

[[d1_databases]]
binding = "DB"
database_name = "sudoku"
# Production D1 id, used by `wrangler deploy` / any `--remote` command. Not a
# credential -- account auth is still required to reach the database. `wrangler
# dev`/--local ignores it and uses a local SQLite keyed by database_name, so
# scripts/dev-local needs no account.
database_id = "2aa2db0c-1a2c-447d-be32-6853804c2f5e"
