<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Mobile-first: fit device width, no user zoom (the grid handles its own sizing). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1b1b1f">
  <title>Sudoku</title>
  <link data-trunk rel="css" href="style.css">
  <!-- Start fetching the JS module graph at parse time, in parallel, instead of
       discovering it through app.js's import waterfall. The first group paints
       Home; the second is dynamically imported just after (kept warm here). -->
  <link rel="modulepreload" href="app.js">
  <link rel="modulepreload" href="home.js">
  <link rel="modulepreload" href="store.js">
  <link rel="modulepreload" href="util.js">
  <link rel="modulepreload" href="ui.js">
  <link rel="modulepreload" href="curriculum.js">
  <link rel="modulepreload" href="play.js">
  <link rel="modulepreload" href="stats.js">
  <link rel="modulepreload" href="cheat.js">
  <link rel="modulepreload" href="gen.js">
  <link rel="modulepreload" href="wasm.js">
  <!-- The cdylib bridge (Board/hint/generate/curriculum) on the main thread.
       data-target-name disambiguates it from the worker binary below. -->
  <link data-trunk rel="rust" href="../wasm/Cargo.toml" data-target-name="sudoku_wasm">
  <!-- The generation web worker (a second wasm binary). data-loader-shim emits a
       stable `gen_worker_loader.js` the page instantiates, so the hashed glue
       name never leaks into our code. -->
  <link data-trunk rel="rust" href="../wasm/Cargo.toml" data-bin="gen_worker" data-type="worker" data-loader-shim data-bindgen-target="web">
  <!-- The app is a set of plain ES modules; copy each into dist as-is. app.js is
       the entry point and imports the rest by relative URL. -->
  <!-- The campaign taxonomy, pregenerated by the pre_build hook (see Trunk.toml)
       as an ES module so it loads with the rest of the graph -- no runtime
       fetch -- and the start page renders the tree without waiting for wasm. -->
  <link data-trunk rel="copy-file" href="curriculum.js">
  <link data-trunk rel="copy-file" href="app.js">
  <link data-trunk rel="copy-file" href="wasm.js">
  <link data-trunk rel="copy-file" href="gen.js">
  <link data-trunk rel="copy-file" href="store.js">
  <link data-trunk rel="copy-file" href="util.js">
  <link data-trunk rel="copy-file" href="ui.js">
  <link data-trunk rel="copy-file" href="cheat.js">
  <link data-trunk rel="copy-file" href="play.js">
  <link data-trunk rel="copy-file" href="home.js">
  <link data-trunk rel="copy-file" href="stats.js">
</head>
<body>
  <main id="app">
    <!-- ============================= HOME ============================= -->
    <!-- Start page. Fixed top-to-bottom order so entries keep their place as
         they appear/disappear: Campaign (always), then Continue-last (>=1 active
         puzzle), then Continue-a-puzzle list link (>=2). -->
    <section id="homeView" class="view">
      <header class="topbar">
        <span class="iconbtn" aria-hidden="true"></span>
        <h1>Sudoku</h1>
        <!-- Hidden until at least one puzzle is solved (Stats also hosts the
             solved-puzzle history); set by home.renderHome(). -->
        <button id="statsBtn" class="iconbtn" aria-label="Stats" hidden>
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M4 20V10h3v10H4zm6.5 0V4h3v16h-3zM17 20v-7h3v7h-3z"/>
          </svg>
        </button>
      </header>

      <section class="home-section">
        <h2>Campaign</h2>
        <div id="tierButtons" class="nav-grid"></div>
      </section>

      <button id="continueLastBtn" class="continue-item" hidden></button>
      <button id="continueListBtn" class="continue-item" hidden></button>
    </section>

    <!-- ========================== CAMPAIGN ============================ -->
    <!-- Drill-down: tier (from Home) -> branches (Expert only) -> techniques.
         The back button's target depends on depth (set in home.js). -->
    <section id="campaignView" class="view" hidden>
      <header class="topbar">
        <button id="campaignBack" class="iconbtn" aria-label="Back">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" d="M15 5l-7 7 7 7"/>
          </svg>
        </button>
        <h1 id="campaignTitle">Campaign</h1>
        <span class="iconbtn" aria-hidden="true"></span>
      </header>
      <div id="campaignBody"></div>
    </section>

    <!-- ====================== CONTINUE A PUZZLE ======================= -->
    <section id="puzzlesView" class="view" hidden>
      <header class="topbar">
        <button id="puzzlesBack" class="iconbtn" aria-label="Back">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" d="M15 5l-7 7 7 7"/>
          </svg>
        </button>
        <h1>Continue</h1>
        <span class="iconbtn" aria-hidden="true"></span>
      </header>
      <ul id="puzzlesList" class="continue-list"></ul>
    </section>

    <!-- ============================= PLAY ============================= -->
    <section id="playView" class="view" hidden>
      <header class="topbar">
        <button id="home" class="iconbtn" aria-label="Home">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="currentColor" d="M12 3.2 21 11h-2.8v9h-4.2v-5.6h-4V20H5.8v-9H3z"/>
          </svg>
        </button>
        <h1 id="playTitle">Sudoku</h1>
        <div class="menu">
          <button id="menuBtn" class="iconbtn" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <circle cx="12" cy="5" r="2" fill="currentColor"/>
              <circle cx="12" cy="12" r="2" fill="currentColor"/>
              <circle cx="12" cy="19" r="2" fill="currentColor"/>
            </svg>
          </button>
          <ul id="menuList" class="menu-list" hidden>
            <li><button class="menu-item" data-action="generate">New puzzle</button></li>
            <li><button class="menu-item" data-action="restart">Restart</button></li>
            <li><button class="menu-item" data-action="copy">Copy puzzle</button></li>
          </ul>
        </div>
      </header>

      <!-- 81 cells are injected by play.js. -->
      <div id="board" class="board" role="grid" aria-label="Sudoku board"></div>

      <!-- Cheat-mode debug line: the seed the puzzle was generated from. -->
      <p id="playSeed" class="play-seed" hidden></p>

      <div id="playPad" class="pad">
        <div class="actions">
          <button id="undo" class="key wide">Undo</button>
          <button id="redo" class="key wide">Redo</button>
          <button id="notes" class="key wide" aria-pressed="false">Notes</button>
          <button id="erase" class="key wide">Erase</button>
          <button id="hint" class="key wide">Hint</button>
        </div>
        <div class="digits">
          <button class="key" data-digit="1">1</button>
          <button class="key" data-digit="2">2</button>
          <button class="key" data-digit="3">3</button>
          <button class="key" data-digit="4">4</button>
          <button class="key" data-digit="5">5</button>
          <button class="key" data-digit="6">6</button>
          <button class="key" data-digit="7">7</button>
          <button class="key" data-digit="8">8</button>
          <button class="key" data-digit="9">9</button>
        </div>
      </div>

      <!-- Hint panel: shown in place of the pad (board stays visible above so we
           can highlight regions/cells). Filled by play.js. -->
      <section id="hintPanel" class="hint-panel" hidden>
        <div class="hint-head">
          <h2 id="hintTitle">Hint</h2>
          <button id="hintClose" class="iconbtn" aria-label="Close hint">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="currentColor" d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2"/>
            </svg>
          </button>
        </div>
        <div id="hintBody" class="hint-body"></div>
      </section>
    </section>

    <!-- ============================= STATS ============================ -->
    <section id="statsView" class="view" hidden>
      <header class="topbar">
        <button id="statsBack" class="iconbtn" aria-label="Back">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="2" d="M15 5l-7 7 7 7"/>
          </svg>
        </button>
        <h1>Stats</h1>
        <span class="iconbtn" aria-hidden="true"></span>
      </header>
      <div id="statsBody"></div>
    </section>
  </main>

  <!-- Solved screen. The solve time is shown here only -- there is no running
       clock during play. -->
  <dialog id="solvedDialog" class="dialog">
    <div class="dialog-body solved-body">
      <h2>Solved</h2>
      <p class="solved-time" id="solvedTime"></p>
      <div class="solved-actions">
        <button id="solvedNew" class="key wide">New puzzle</button>
        <button id="solvedHome" class="key wide">Home</button>
      </div>
    </div>
  </dialog>

  <!-- Generation overlay. Backed by the cancellable worker; Cancel terminates
       the in-flight generation. On a budget-exhausted failure, "Keep searching"
       restarts generation uncapped (shown only in the error state). -->
  <div id="loadingOverlay" class="overlay" hidden>
    <div class="overlay-card">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loadingText">Generating…</p>
      <button id="loadingRetry" class="key wide" hidden>Keep searching</button>
      <button id="loadingCancel" class="key wide">Cancel</button>
    </div>
  </div>

  <!-- Load the app via dynamic import from a classic script rather than a
       <script type="module" src>. Trunk injects its wasm bootstrap as a module
       with a top-level `await init()`, which would otherwise block every later
       module script (including this app) until the multi-MB wasm downloads and
       compiles. Dynamic import is not part of that ordered queue, so Home paints
       as soon as its own (preloaded) modules are ready -- the wasm bridge loads
       in parallel and is only needed later, for Hint. -->
  <script>import("./app.js");</script>
</body>
</html>
