# Trunk config for the Sudoku web frontend.
#   trunk serve            # dev server with hot reload (rebuilds wasm + assets)
#   trunk build --release  # static bundle in web/dist for deployment
#
# The wasm crate, CSS, and app.js are declared as assets in index.html; the
# wasm32 build picks up +simd128 from ../.cargo/config.toml.
[build]
target = "index.html"

# Pregenerate the campaign taxonomy before each build, from the same `lab::kinds`
# source as the wasm `curriculum()` export (no drift). Emitted as an ES module
# (`export default [...]`) so the start page imports it as part of its module
# graph -- no extra runtime fetch / round-trip -- and renders the tree without
# waiting for wasm. cwd is this dir, so the file lands in web/.
[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = [
  "-c",
  "printf 'export default %s;\\n' \"$(cargo run --quiet --manifest-path ../core/Cargo.toml --example gen_curriculum)\" > curriculum.js",
]

# Stamp the build with its source commit so every recorded solve carries the
# exact client version (web/backend.js -> the backend's client_version column).
# Same generated-gitignored-ES-module pattern as curriculum.js above. The hash
# is the short HEAD; '-dirty' is appended when built from a modified working
# tree (tracked changes vs HEAD). One mechanism locally and in CI, where the
# checkout is the deployed commit. Falls back to "unknown" outside a git repo.
[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = [
  "-c",
  "if v=$(git rev-parse --short HEAD 2>/dev/null); then git diff --quiet HEAD 2>/dev/null || v=\"$v-dirty\"; else v=unknown; fi; printf 'export default \"%s\";\\n' \"$v\" > version.js",
]

# Bake the backend endpoint + shared key into a gitignored ES module so the build
# can be retargeted (local dev vs production) WITHOUT editing source, and so the
# key is never committed. The ENDPOINT default is the production worker URL (a
# non-secret); the API_KEY default stays a placeholder, so backend.js no-ops via
# its CONFIGURED guard until a real key is supplied. The real key is injected only
# at deploy time from the SUDOKU_API_KEY GitHub Actions secret (see
# .github/workflows/deploy.yml); scripts/dev-local overrides both env vars to
# point at the local worker. Same generated-module pattern as version.js above.
[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = [
  "-c",
  "printf 'export const ENDPOINT = \"%s\";\\nexport const API_KEY = \"%s\";\\n' \"${SUDOKU_BACKEND_ENDPOINT:-https://sudoku-backend.nitz-stefan.workers.dev/solves}\" \"${SUDOKU_API_KEY:-<paste-the-same-secret>}\" > backend-config.js",
]

# Rebuild when the frontend OR the Rust sources behind the wasm bridge change.
# Watch the whole web/ dir (recursive) so newly added assets are picked up with
# no edit here; core and wasm live outside web/ so add their paths too.
# `ignore` excludes files written *during* a build, which would otherwise loop:
# curriculum.js is regenerated by the pre_build hook every build. (Trunk already
# auto-ignores the dist output dir, but it's listed for clarity.)
[watch]
watch = [
  ".",
  "../wasm/src",
  "../wasm/Cargo.toml",
  "../core/src",
  "../core/Cargo.toml",
  "../generator-lab/src",
  "../generator-lab/Cargo.toml",
]
ignore = [
  "curriculum.js",
  "version.js",
  "backend-config.js",
  "dist",
]
