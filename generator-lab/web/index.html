<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>generator-lab bench</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 1.2rem;
        max-width: 40rem;
        line-height: 1.4;
      }
      h1 { font-size: 1.3rem; margin: 0 0 0.3rem; }
      p.sub { margin: 0 0 1rem; opacity: 0.7; font-size: 0.9rem; }
      .controls { display: flex; gap: 0.8rem; align-items: end; flex-wrap: wrap; margin-bottom: 1rem; }
      label { display: flex; flex-direction: column; font-size: 0.85rem; gap: 0.2rem; }
      input { font-size: 1.1rem; padding: 0.4rem; width: 6rem; }
      .buttons { display: flex; gap: 0.8rem; flex-wrap: wrap; }
      button {
        font-size: 1.2rem;
        padding: 0.7rem 1.4rem;
        border-radius: 0.6rem;
        border: none;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }
      button.drill { background: #7c3aed; }
      button:disabled { opacity: 0.5; }
      #status { margin: 0.8rem 0; font-weight: 600; min-height: 1.4rem; }
      pre {
        background: rgba(127,127,127,0.12);
        padding: 0.8rem;
        border-radius: 0.5rem;
        overflow-x: auto;
        font-size: 0.95rem;
        white-space: pre;
      }
      .env { font-size: 0.78rem; opacity: 0.7; word-break: break-all; margin-top: 1rem; }
    </style>
  </head>
  <body>
    <h1>generator-lab bench</h1>
    <p class="sub">hidden-quad generator (random method), wasm+simd128. Run train or drill, attempt-limited.</p>

    <div class="controls">
      <label>attempts
        <input id="attempts" type="number" value="1500" min="100" step="100" />
      </label>
      <label>seed
        <input id="seed" type="number" value="1" min="1" />
      </label>
      <label>note (optional)
        <input id="note" type="text" placeholder="e.g. Pixel 7" style="width: 9rem" />
      </label>
    </div>
    <div class="buttons">
      <button id="run-train">Run train</button>
      <button id="run-drill" class="drill">Run drill</button>
    </div>

    <div id="status">loading wasm…</div>
    <pre id="results"></pre>
    <p class="env" id="env"></p>

    <script>
      const MODES = { train: 0, drill: 1 };

      const $ = (id) => document.getElementById(id);
      const status = $("status");
      const results = $("results");

      function engineLabel() {
        const ua = navigator.userAgent;
        if (/Firefox|FxiOS/.test(ua)) return "Firefox (SpiderMonkey)";
        if (/EdgA?|Edge/.test(ua)) return "Edge (V8)";
        if (/CriOS/.test(ua)) return "Chrome iOS (WebKit, no V8!)";
        if (/Chrome|Chromium/.test(ua)) return "Chrome (V8)";
        if (/Safari/.test(ua)) return "Safari (JavaScriptCore)";
        return "unknown";
      }
      $("env").textContent = engineLabel() + " — " + navigator.userAgent;

      // Persist the note across reloads (handy on a phone).
      try {
        const saved = localStorage.getItem("generator-lab-note");
        if (saved !== null) $("note").value = saved;
        $("note").addEventListener("input", () => {
          try { localStorage.setItem("generator-lab-note", $("note").value); } catch (e) {}
        });
      } catch (e) {}

      let exports = null;

      async function load() {
        try {
          const resp = await fetch("generator_lab.wasm", { cache: "no-cache" });
          const bytes = await resp.arrayBuffer();
          if (!WebAssembly.validate(new Uint8Array(bytes))) {
            throw new Error("module failed validation (simd128 unsupported?)");
          }
          const { instance } = await WebAssembly.instantiate(bytes, {});
          exports = instance.exports;
          status.textContent = "ready — tap Run train or Run drill";
          $("run-train").disabled = false;
          $("run-drill").disabled = false;
        } catch (e) {
          status.textContent = "load failed: " + e.message;
        }
      }

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      async function run(modeName) {
        const mode = MODES[modeName];
        $("run-train").disabled = true;
        $("run-drill").disabled = true;
        const attempts = Math.max(100, Number($("attempts").value) | 0);
        const seed = Math.max(1, Number($("seed").value) | 0);

        status.textContent = "running " + modeName + "…";
        await sleep(30); // let the DOM paint before the blocking call

        // Warm up the JIT, then measure.
        exports.bench(mode, Math.min(attempts, 400), seed);
        const t0 = performance.now();
        const fp = exports.bench(mode, attempts, seed) >>> 0;
        const ms = performance.now() - t0;
        const puzzles = exports.bench_yield(mode, attempts, seed) >>> 0;

        const us = (ms * 1000) / attempts;
        const attsPer = puzzles > 0 ? attempts / puzzles : null;
        const attsStr = attsPer === null ? "inf" : attsPer.toFixed(0);

        const header =
          "engine: " + engineLabel() + "\n" +
          attempts + " attempts, seed " + seed + "\n\n" +
          "mode".padEnd(7) + "ms".padStart(9) + "us/attempt".padStart(13) +
          "puzzles".padStart(9) + "atts/puzzle".padStart(13) + "\n";
        results.textContent =
          header +
          modeName.padEnd(7) +
          ms.toFixed(1).padStart(9) +
          us.toFixed(1).padStart(13) +
          String(puzzles).padStart(9) +
          attsStr.padStart(13) + "\n";

        // Report back to the laptop so nothing has to be hand-typed.
        status.textContent = "done — reporting…";
        const payload = {
          ts: new Date().toISOString(),
          engine: engineLabel(),
          ua: navigator.userAgent,
          note: $("note").value || "",
          attempts,
          seed,
          results: [{ mode: modeName, ms, us, puzzles, atts_per: attsPer, fp }],
        };
        try {
          const r = await fetch("/report", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          status.textContent = r.ok
            ? "done — reported to laptop"
            : "done — report failed (HTTP " + r.status + "); read numbers above";
        } catch (e) {
          status.textContent = "done — report failed (" + e.message + "); read numbers above";
        }
        $("run-train").disabled = false;
        $("run-drill").disabled = false;
      }

      $("run-train").disabled = true;
      $("run-drill").disabled = true;
      $("run-train").addEventListener("click", () => run("train"));
      $("run-drill").addEventListener("click", () => run("drill"));
      load();
    </script>
  </body>
</html>
