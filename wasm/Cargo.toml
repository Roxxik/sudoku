[package]
name = "sudoku-wasm"
version = "0.1.0"
edition = "2024"

# Browser bridge over sudoku-core. Built with wasm-bindgen; Trunk drives the
# build (`trunk serve` for hot reload, `trunk build --release` for a static
# dist/). The wasm32 build picks up `+simd128` from .cargo/config.toml, so
# core's portable_simd code lowers to v128 instructions.
[lib]
crate-type = ["cdylib"]

[dependencies]
sudoku-core = { path = "../core" }
wasm-bindgen = "0.2"
# Steps cross to JS as plain garbage-collected objects (not JSON strings, not
# owned wasm handles): serde_wasm_bindgen walks the mirror structs and builds
# live JS values directly. The UI turns that data into display strings.
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# The generation web worker (src/bin/gen_worker.rs) runs lab generation off the
# main thread so a slow/hard target never freezes the UI; cancellation is a
# worker.terminate(). It talks to the page over postMessage, so it needs the
# worker global scope and message-event bindings.
js-sys = "0.3"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "MessageEvent"] }
