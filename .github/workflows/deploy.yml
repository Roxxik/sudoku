name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Toolchain (nightly + wasm target) is pinned in rust-toolchain.toml;
      # @master reads it so CI matches local. core needs nightly for portable_simd.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-29
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Install Trunk via cargo rather than a third-party action, so there's no
      # Node-runtime action to keep off deprecation cycles. Cached by rust-cache.
      - name: Install Trunk
        run: cargo install --locked trunk@0.21.14

      - name: Build web
        working-directory: ./web
        # The solve-log shared key, kept out of git and injected here. The Trunk
        # pre_build hook bakes it into web/backend-config.js; the endpoint default
        # is the production worker URL in web/Trunk.toml. NB it is public in the
        # shipped bundle by necessity (no server-side render) -- this only keeps it
        # out of the repo / lets it rotate without a commit, not secret from users.
        env:
          SUDOKU_API_KEY: ${{ secrets.SUDOKU_API_KEY }}
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
